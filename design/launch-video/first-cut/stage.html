<!doctype html>
<!-- The launch video, as a page rendered one frame at a time: render.cjs calls
     seek(t) and screenshots. Screens are 2x stills of the demo clone (capture.cjs);
     every motion here is a pure function of t, so a render is reproducible. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #0d0c13; --gold: #f0bf55; --gold2: #e0a33a; --violet: #8e95ff; --text: #f4f2ff; --muted: #a6a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { font-family: 'Inter Display', 'Inter', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; background:
      radial-gradient(1100px 700px at 18% 8%, rgba(142,149,255,.16), transparent 60%),
      radial-gradient(900px 650px at 88% 96%, rgba(240,191,85,.10), transparent 60%),
      linear-gradient(180deg, #12101b 0%, #0b0a10 100%); }
  #grain { position: absolute; inset: 0; opacity: .05; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .headline { position: absolute; left: 0; right: 0; top: 48px; text-align: center; }
  .headline h1 { font-size: 58px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; }
  .headline p { margin-top: 10px; font-size: 24px; font-weight: 450; color: var(--muted); letter-spacing: -0.005em; }
  .gold { background: linear-gradient(180deg, #ffd77e, var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word { display: inline-block; will-change: transform, opacity; }
  /* The app, in a browser window. */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: #f7f7f8;
         box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform-origin: 50% 0; }
  .chrome { height: 40px; background: #ececef; display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid #dcdce2; }
  .chrome i { width: 12px; height: 12px; border-radius: 50%; background: #d4d4da; display: inline-block; }
  .chrome i:nth-child(1) { background: #ff5f57; } .chrome i:nth-child(2) { background: #febc2e; } .chrome i:nth-child(3) { background: #28c840; }
  .url { margin: 0 auto; transform: translateX(-30px); background: #fff; border-radius: 8px; height: 26px; min-width: 460px; padding: 0 14px;
         font: 500 14px 'Inter', sans-serif; color: #55556a; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .url b { color: #1d1d29; font-weight: 600; }
  .content { position: relative; width: 1440px; height: 900px; overflow: hidden; transform-origin: 0 0; }
  .content img.screen { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .cursor { position: absolute; width: 30px; height: 30px; margin: -3px 0 0 -5px; z-index: 5; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ripple { position: absolute; width: 60px; height: 60px; margin: -30px; border-radius: 50%; border: 3px solid rgba(84,84,212,.9); z-index: 4; opacity: 0; }
  .tag { position: absolute; font: 600 18px 'Inter', sans-serif; color: #fff; background: rgba(20,18,30,.82); border: 1px solid rgba(255,255,255,.12);
         padding: 8px 14px; border-radius: 10px; backdrop-filter: blur(6px); white-space: nowrap; }
  .tag small { color: var(--muted); font-weight: 500; margin-left: 8px; }
  .page { position: absolute; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.5); border-radius: 4px; overflow: hidden; }
  .page img { width: 100%; display: block; }
  .phone { position: absolute; width: 400px; height: 866px; border-radius: 56px; background: #111; padding: 14px; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 2px #2a2933; }
  .phone img { width: 372px; height: 805px; border-radius: 44px; display: block; object-fit: cover; object-position: top; }
  .chips { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .chip { font: 600 22px 'Inter', sans-serif; padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--text); }
  #intro .mark, #end .mark { position: absolute; left: 50%; width: 168px; height: 168px; margin-left: -84px; border-radius: 38px; }
  .wordmark { position: absolute; left: 0; right: 0; text-align: center; font-size: 120px; font-weight: 700; letter-spacing: -0.045em; }
  .tagline { position: absolute; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 500; color: var(--muted); }
  .big { position: absolute; left: 0; right: 0; text-align: center; font-size: 88px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }
  .cta { position: absolute; left: 50%; transform: translateX(-50%); font: 600 30px 'Inter', sans-serif; padding: 16px 34px; border-radius: 999px;
         background: linear-gradient(180deg, #ffd77e, var(--gold2)); color: #1b1408; box-shadow: 0 10px 40px rgba(240,191,85,.25); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<div id="grain"></div>
<script src="timeline.js"></script>
</body>
</html>
