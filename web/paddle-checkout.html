<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Secure checkout</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js" defer></script>
  <script src="/paddle-checkout.js" defer></script>
</head>
<body>
  <main style="max-width:520px;margin:15vh auto;padding:24px">
    <h1>Secure checkout</h1>
    <p id="checkout-status" role="status">Loading Paddle checkout…</p>
    <button id="checkout-retry" hidden>Open checkout</button>
    <p><a href="/">Return to the app</a></p>
  </main>
</body>
</html>
