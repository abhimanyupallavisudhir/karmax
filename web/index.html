<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="tavya is the agentic to-do list that completes itself. Say what needs doing; agents do it on their own computers, with your accounts and your OK." />
    <meta name="theme-color" content="#5b5bd6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="tavya" />
    <title>tavya</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Fetched with the page, not when the script first renders text: no fallback-font flash. -->
    <link rel="preload" href="/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="action-progress" id="action-progress" role="progressbar" aria-label="Action in progress" hidden><span></span></div>
    <div id="app"></div>
    <div id="overlay-root"></div>
    <div id="modal-root"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script src="/totp-qr.js"></script>
    <script src="/markdown.js"></script>
    <script src="/file-view.js"></script>
    <script type="module" src="/app.js"></script>
    <script src="/register-service-worker.js" defer></script>
  </body>
</html>
