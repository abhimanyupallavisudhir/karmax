version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by digest, which never moves on its own; these
  # updates are how the images keep receiving the distributions' fixes.
  - package-ecosystem: docker
    directories: [/deploy, /environments/browser, /scripts/rehearsal]
    schedule:
      interval: weekly
