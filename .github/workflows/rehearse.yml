name: Rehearse upgrade

# Rehearses a release upgrade on a production-shaped turnkey stack
# (scripts/rehearse-upgrade.sh; wiki ops/release-and-deploy, "Rehearsing an
# upgrade"), which a data-epoch change needs before it deploys. It runs on
# GitHub's hosted runners, which have the Docker a task world lacks. Nothing
# reaches production or spends credit: the stack is its own Compose project
# with the mock agent and a local E2B stand-in. Dispatch it with `to` set to
# the branch to upgrade to (GitHub dispatches only workflows on the default
# branch); a push to a task branch that changes deploy/ (the data epoch, the
# updater, Compose, the image) or the rehearsal itself rehearses that branch
# from master on its own. The summary
# is the run's job summary, and the summary, the full output and every step's
# logs are the `rehearsal` artifact.
on:
  push:
    branches: ['tavya/**']
    paths:
      # The data epoch, and everything else the updater, Compose and the
      # image are made of: a change to how the stack upgrades.
      - deploy/**
      - scripts/rehearse-upgrade.sh
      - scripts/rehearsal/**
      - .github/workflows/rehearse.yml
  workflow_dispatch:
    inputs:
      from:
        description: Branch to upgrade from (the deployed revision)
        default: master
        required: true
      to:
        description: Branch to upgrade to
        required: true

permissions:
  contents: read

# A push carries no inputs: it rehearses master → the pushed branch.
env:
  FROM: ${{ github.event.inputs.from || 'master' }}
  TO: ${{ github.event.inputs.to || github.ref_name }}

concurrency:
  group: rehearse-${{ github.event.inputs.to || github.ref_name }}
  cancel-in-progress: true

jobs:
  rehearse:
    name: rehearse ${{ github.event.inputs.from || 'master' }} → ${{ github.event.inputs.to || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TO's own harness: a release's new rehearsal checks run on it.
          ref: ${{ github.event.inputs.to || github.ref }}
          # The harness pushes both revisions into a scratch origin and may
          # deploy a merge of them, so it needs their history.
          fetch-depth: 0
      - name: Fetch the two branches
        run: git fetch --no-tags origin "+refs/heads/$FROM:refs/remotes/origin/$FROM" "+refs/heads/$TO:refs/remotes/origin/$TO"
      - name: Git identity
        # When TO does not descend from FROM, the harness deploys a commit it
        # makes with `git commit-tree`, which needs an author.
        run: |
          git config --global user.name 'karmax rehearsal'
          git config --global user.email 'rehearsal@karmax.invalid'
      - name: Rehearse
        run: |
          set -o pipefail
          scripts/rehearse-upgrade.sh --from "origin/$FROM" --to "origin/$TO" --work "$RUNNER_TEMP/rehearsal" \
            2>&1 | tee "$RUNNER_TEMP/rehearsal.out"
      - name: Summary
        if: always()
        run: |
          out=$RUNNER_TEMP/rehearsal.out
          mkdir -p "$RUNNER_TEMP/rehearsal"
          if [ -f "$out" ] && grep -q '^== Rehearsal summary' "$out"; then
            sed -n '/^== Rehearsal summary/,$p' "$out" > "$RUNNER_TEMP/rehearsal/summary.txt"
          else
            { echo 'The rehearsal stopped before its summary; the last output:'; tail -n 60 "$out" 2>/dev/null; } > "$RUNNER_TEMP/rehearsal/summary.txt"
          fi
          cp "$out" "$RUNNER_TEMP/rehearsal/" 2>/dev/null || true
          { echo '```'; cat "$RUNNER_TEMP/rehearsal/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the summary and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal
          # state.json holds the seed's throwaway test passwords; it stays out.
          path: |
            ${{ runner.temp }}/rehearsal/summary.txt
            ${{ runner.temp }}/rehearsal/rehearsal.out
            ${{ runner.temp }}/rehearsal/logs/
          if-no-files-found: warn
          retention-days: 14
