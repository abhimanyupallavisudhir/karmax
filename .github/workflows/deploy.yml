name: Deploy

# Deployment is a separate post-merge concern. A failed production rollout must
# not masquerade as a failed PR validation check, and only the exact master SHA
# whose CI workflow completed successfully is eligible for promotion.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Full master commit SHA to redeploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to production
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # GitHub retains the running deployment and coalesces pending requests to the
    # newest validated master SHA. That is sufficient because every newer SHA
    # contains its ancestors; the remote updater also refuses to move backwards.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Deploy the validated revision over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          case "$DEPLOY_SHA" in
            ''|*[!0-9a-fA-F]*) echo "invalid deployment SHA: $DEPLOY_SHA" >&2; exit 1 ;;
          esac
          [ "${#DEPLOY_SHA}" -eq 40 ] || { echo "deployment SHA must be 40 hexadecimal characters" >&2; exit 1; }
          case "$RUN_KEY" in ''|*[!0-9-]*) echo 'invalid deployment run key' >&2; exit 1;; esac
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # The host key is pinned above, so an unknown one is a failure rather
          # than something to trust on first use.
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$TARGET" "
            set -eu
            cd /opt/karmax
            # Execute the updater implementation from the exact validated SHA.
            # This lets a new revision repair a bug in an older updater before
            # that bug can block the revision from checking itself out.
            git fetch --prune origin master
            git merge-base --is-ancestor '$DEPLOY_SHA' refs/remotes/origin/master
            git show '$DEPLOY_SHA:deploy/karmax' > ./deploy/.karmax-update
            git show '$DEPLOY_SHA:deploy/update-runner.sh' > ./deploy/.karmax-runner
            chmod 700 ./deploy/.karmax-update ./deploy/.karmax-runner
            trap 'rm -f ./deploy/.karmax-update ./deploy/.karmax-runner' EXIT
            ./deploy/.karmax-runner start '$DEPLOY_SHA' '$RUN_KEY' ./deploy/.karmax-update
          "
          for attempt in $(seq 1 180); do
            state=$(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$TARGET" \
              "cat '/opt/karmax/deploy/.updates/$RUN_KEY/status'") || { sleep 10; continue; }
            case "$state" in
              success)
                ssh -o StrictHostKeyChecking=yes "$TARGET" \
                  "tail -n 100 '/opt/karmax/deploy/.updates/$RUN_KEY/log'; find /opt/karmax/deploy/backups -mindepth 1 -maxdepth 1 -type d -name 'predeploy-*' -mtime +14 -exec rm -rf {} + 2>/dev/null || true"
                exit 0 ;;
              failed:*)
                ssh -o StrictHostKeyChecking=yes "$TARGET" \
                  "tail -n 100 '/opt/karmax/deploy/.updates/$RUN_KEY/log'" || true
                echo "deployment failed: $state" >&2
                exit 1 ;;
              running) sleep 10 ;;
              *) echo "invalid deployment status: $state" >&2; exit 1 ;;
            esac
          done
          echo 'deployment is still running on the host; inspect its durable log and status' >&2
          exit 1
