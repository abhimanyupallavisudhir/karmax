name: Deploy

# Deployment is a separate post-merge concern. A failed production rollout must
# not masquerade as a failed PR validation check, and only the exact master SHA
# whose CI workflow completed successfully is eligible for promotion.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Full master commit SHA to redeploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to production
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # GitHub retains the running deployment and coalesces pending requests to the
    # newest validated master SHA. That is sufficient because every newer SHA
    # contains its ancestors; the remote updater also refuses to move backwards.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - name: Deploy the validated revision over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          case "$DEPLOY_SHA" in
            ''|*[!0-9a-fA-F]*) echo "invalid deployment SHA: $DEPLOY_SHA" >&2; exit 1 ;;
          esac
          [ "${#DEPLOY_SHA}" -eq 40 ] || { echo "deployment SHA must be 40 hexadecimal characters" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # The host key is pinned above, so an unknown one is a failure rather
          # than something to trust on first use.
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$TARGET" "
            set -eu
            cd /opt/karmax
            # Execute the updater implementation from the exact validated SHA.
            # This lets a new revision repair a bug in an older updater before
            # that bug can block the revision from checking itself out.
            git fetch --prune origin master
            git merge-base --is-ancestor '$DEPLOY_SHA' refs/remotes/origin/master
            git show '$DEPLOY_SHA:deploy/karmax' > ./deploy/.karmax-update
            chmod 700 ./deploy/.karmax-update
            trap 'rm -f ./deploy/.karmax-update' EXIT
            ./deploy/.karmax-update update '$DEPLOY_SHA'
            find deploy/backups -mindepth 1 -maxdepth 1 -type d -mtime +14 \\
              -exec rm -rf {} + 2>/dev/null || true
          "
