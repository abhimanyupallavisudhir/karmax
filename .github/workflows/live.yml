name: Live

# The live suites spend real model and sandbox credit and write to a real
# GitHub account, so push and pull-request CI never runs them. Dispatch this
# workflow to run them, or set the repository variable KARMAX_LIVE_SCHEDULE to
# `true` to also run them every Monday; the schedule does nothing until then.
# Each suite runs only when its secret is configured (TESTING.md, "Live tests"),
# and only on master: a dispatch runs the chosen branch's tests with the secrets.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live suite to run
        type: choice
        default: all
        options: [all, models, agent, claude, e2b, daytona, vm, move, github]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# One run at a time: the GitHub suite reuses a single fixture repository.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  plan:
    name: choose suites
    # Defence in depth; the control is the live environment's branch rule.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.KARMAX_LIVE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live
    outputs:
      models: ${{ steps.plan.outputs.models }}
      agent: ${{ steps.plan.outputs.agent }}
      claude: ${{ steps.plan.outputs.claude }}
      e2b: ${{ steps.plan.outputs.e2b }}
      daytona: ${{ steps.plan.outputs.daytona }}
      vm: ${{ steps.plan.outputs.vm }}
      move: ${{ steps.plan.outputs.move }}
      github: ${{ steps.plan.outputs.github }}
    steps:
      # Job conditions cannot read secrets, so their presence is decided here.
      - name: Choose the selected suites whose secrets are configured
        id: plan
        env:
          SELECTED: ${{ inputs.suite || 'all' }}
          LIVE_ANTHROPIC_API_KEY: ${{ secrets.LIVE_ANTHROPIC_API_KEY }}
          LIVE_OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}
          LIVE_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.LIVE_CLAUDE_CODE_OAUTH_TOKEN }}
          LIVE_E2B_API_KEY: ${{ secrets.LIVE_E2B_API_KEY }}
          LIVE_DAYTONA_API_KEY: ${{ secrets.LIVE_DAYTONA_API_KEY }}
          LIVE_OPENCODE_ANTHROPIC_API_KEY: ${{ secrets.LIVE_OPENCODE_ANTHROPIC_API_KEY }}
          LIVE_FLY_API_TOKEN: ${{ secrets.LIVE_FLY_API_TOKEN }}
          LIVE_HETZNER_API_TOKEN: ${{ secrets.LIVE_HETZNER_API_TOKEN }}
          LIVE_VM_OPENAI_API_KEY: ${{ secrets.LIVE_VM_OPENAI_API_KEY }}
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          LIVE_GITHUB_FORK_TOKEN: ${{ secrets.LIVE_GITHUB_FORK_TOKEN }}
        run: |
          # decide SUITE SECRET...: the suite runs when selected and any of its secrets is set.
          # decide_all SUITE SECRET...: the same, but every secret must be set.
          decide() {
            suite=$1; shift
            run=false; why="$* not set"
            for secret in "$@"; do [ -z "$(printenv "$secret")" ] || run=true; done
            report "$suite"
          }
          decide_all() {
            suite=$1; shift
            run=true; why="$* not all set"
            for secret in "$@"; do [ -n "$(printenv "$secret")" ] || run=false; done
            report "$suite"
          }
          report() {
            suite=$1
            if [ "$SELECTED" != all ] && [ "$SELECTED" != "$suite" ]; then run=false; why='not selected'; fi
            echo "$suite=$run" >> "$GITHUB_OUTPUT"
            if [ "$run" = true ]; then echo "$suite: runs"; else echo "$suite: skipped ($why)"; fi
          }
          decide models LIVE_ANTHROPIC_API_KEY LIVE_OPENAI_API_KEY
          decide agent LIVE_OPENAI_API_KEY
          decide claude LIVE_CLAUDE_CODE_OAUTH_TOKEN
          decide e2b LIVE_E2B_API_KEY
          decide daytona LIVE_DAYTONA_API_KEY
          decide vm LIVE_FLY_API_TOKEN LIVE_HETZNER_API_TOKEN
          decide_all move LIVE_E2B_API_KEY LIVE_HETZNER_API_TOKEN
          decide github LIVE_GITHUB_TOKEN LIVE_GITHUB_FORK_TOKEN

  models:
    name: model providers
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      # Each provider's block skips itself when its key is absent.
      - run: npx vitest run tests/live-providers.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.LIVE_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}

  agent:
    name: agent task on Temporal
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: ./.github/actions/temporal-cli
      - run: npx vitest run tests/live-agent.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}

  claude:
    name: Claude Code login
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: npx vitest run tests/claude-permission.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.LIVE_CLAUDE_CODE_OAUTH_TOKEN }}
      # A public claude.ai share, read the way tavya reads one (skips without the variable).
      - run: npx vitest run tests/claude-share-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          KARMAX_LIVE_CLAUDE_SHARE: ${{ vars.LIVE_CLAUDE_SHARE }}

  e2b:
    name: E2B sandboxes
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.e2b == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: ./.github/actions/temporal-cli
      # On-demand resources: the sandboxes reach this runner's repository server through a Cloudflare quick tunnel.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          echo "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          sudo install "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      # The smoke checks, then a whole task: pause at Review, resume, teardown.
      - run: npx vitest run tests/cloud-live.test.ts tests/e2b-workflow-live.test.ts tests/e2b-computer-live.test.ts tests/resource-on-demand-live.test.ts tests/subtask-computer-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          KARMAX_LIVE_DATA_GB: '1'
          E2B_API_KEY: ${{ secrets.LIVE_E2B_API_KEY }}

  daytona:
    name: Daytona sandboxes
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.daytona == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: ./.github/actions/temporal-cli
      # The snapshot build stays behind its own KARMAX_DAYTONA_LIVE_BUILD switch.
      - run: npx vitest run tests/daytona-live.test.ts tests/daytona-limits-live.test.ts tests/daytona-environment-live.test.ts tests/daytona-workflow-live.test.ts tests/remote-acp-live.test.ts tests/remote-acp-workflow-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          DAYTONA_API_KEY: ${{ secrets.LIVE_DAYTONA_API_KEY }}
          # OpenCode's model key, its own secret like every suite's; without it
          # the OpenCode suites skip (their E2B half runs only by hand).
          ANTHROPIC_API_KEY: ${{ secrets.LIVE_OPENCODE_ANTHROPIC_API_KEY }}

  vm:
    name: Fly.io and Hetzner VM worlds
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      # Per provider whose token is set: a 100 GB world, a real agent turn, park
      # and wake, growth to 150 GB; everything it creates is deleted. A Fly
      # organization needs a payment method (its free trial stops machines at 5 min).
      - run: npx vitest run tests/vm-world-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          FLY_API_TOKEN: ${{ secrets.LIVE_FLY_API_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.LIVE_HETZNER_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.LIVE_VM_OPENAI_API_KEY }}
      # A whole task per provider: setup with apt and pip, park, a follow-up
      # wakes it (Hetzner: on a new server) with its files and setup, Done.
      - run: npx vitest run tests/vm-workflow-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          FLY_API_TOKEN: ${{ secrets.LIVE_FLY_API_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.LIVE_HETZNER_API_TOKEN }}
      # A full Hetzner limit: the task waits for a machine, starts on Retry once
      # it fits, and Free computer deletes its server and volume.
      - run: npx vitest run tests/vm-capacity-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          HCLOUD_TOKEN: ${{ secrets.LIVE_HETZNER_API_TOKEN }}

  move:
    name: Moving a running task between providers
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.move == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      # An E2B world checkpointed and restored on a 100 GB Hetzner volume, and
      # its fallback to E2B when Hetzner refuses; deletes everything it creates.
      - run: npx vitest run tests/computer-move-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          E2B_API_KEY: ${{ secrets.LIVE_E2B_API_KEY }}
          HCLOUD_TOKEN: ${{ secrets.LIVE_HETZNER_API_TOKEN }}

  github:
    name: GitHub pull requests
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.github == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - uses: ./.github/actions/temporal-cli
      # A fine-grained token limited to the private karmax-e2e-tests repository,
      # which the suite reuses; it clones and pushes over HTTPS with it.
      - run: npx vitest run tests/github-live.test.ts
        env:
          KARMAX_RUN_LIVE: '1'
          GH_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
      # A classic public_repo token of the fork's owner, who also owns the
      # App-less upstream organization (wiki features/fork-contributions).
      - run: npx vitest run tests/github-fork-live.test.ts
        if: ${{ !cancelled() }}
        env:
          KARMAX_RUN_LIVE: '1'
          LIVE_GITHUB_FORK_TOKEN: ${{ secrets.LIVE_GITHUB_FORK_TOKEN }}
