name: Scheduled backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Snapshot production data
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$TARGET" '
            set -eu
            cd /opt/karmax
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            ./deploy/karmax backup "deploy/backups/scheduled-$stamp"
            find deploy/backups -mindepth 1 -maxdepth 1 -type d -name "scheduled-*" -mtime +14 -exec rm -rf {} +
          '
