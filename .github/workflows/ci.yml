name: CI

on:
  push:
    branches: [master]
  pull_request:
  # When an eligible organization-owned deployment enables GitHub's native
  # queue, required checks must report on the speculative landing candidate.
  # Personal/private deployments simply never emit this event.
  merge_group:
  # Validate any branch on demand, e.g. a CI change before its PR exists.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run redundant. master is
# excluded so every landed commit keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    name: workflows + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin both the release and archive digest.
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Validate every repository workflow
        run: |
          "$RUNNER_TEMP/actionlint"

      # Guard the exact outage class: YAML parsers accept this shape, but GitHub
      # rejects the unsupported key before it creates any workflow run.
      - name: Prove unsupported workflow keys fail the gate
        run: |
          invalid="$RUNNER_TEMP/invalid-workflow.yml"
          cp .github/workflows/deploy.yml "$invalid"
          sed -i '/cancel-in-progress: false/a\      queue: max' "$invalid"
          if "$RUNNER_TEMP/actionlint" "$invalid" >"$RUNNER_TEMP/actionlint-negative.log" 2>&1; then
            echo 'actionlint accepted the unsupported concurrency.queue regression fixture' >&2
            exit 1
          fi
          grep -F 'unexpected key "queue"' "$RUNNER_TEMP/actionlint-negative.log"

      - uses: ./.github/actions/install
      # npm audit --audit-level=high, except advisories reviewed (with an expiry)
      # in scripts/audit-allowlist.json.
      - run: npm run audit-check
      - run: npm run typecheck
      # No lint errors, and no more warnings or `as any` casts than scripts/lint-budget.json allows.
      - run: npm run lint

  test:
    # Each shard runs its share of the files exactly as `npm test` does
    # locally: one file at a time (vitest.config.ts), so no runner ever hosts
    # more than one Temporal server. Shards are balanced by measured duration
    # (tests/durations.json); no shard can finish faster than the slowest
    # single file, so add one only while the shards are well above that.
    name: tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      # Report every shard's failures, not just the first one's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karmax_test
          POSTGRES_PASSWORD: karmax_test
          POSTGRES_DB: karmax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karmax_test -d karmax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # About three times a shard's normal runtime: slow runners have taken
    # twice as long, while a genuine hang still fails reasonably soon.
    timeout-minutes: 25
    env:
      # Paid live suites remain opt-in. These shards run the Docker suites too.
      KARMAX_TEST_PASS_INTEROP: '1'
      KARMAX_TEST_PASS_BROWSER: '1'
      KARMAX_TEST_POSTGRES_URL: postgres://karmax_test:karmax_test@127.0.0.1:5432/karmax_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install

      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for browser regressions
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cached browser still needs the system libraries it links against.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install password-store interoperability tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age gnupg oathtool pass pass-extension-otp
          archive="$RUNNER_TEMP/gopass.tar.gz"
          curl -fsSL 'https://github.com/gopasspw/gopass/releases/download/v1.17.2/gopass-1.17.2-linux-amd64.tar.gz' -o "$archive"
          echo "95df834e451dec445565b8132efd4d9d18cb889b56d0fc65382d4ac3efdefb08  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gopass
          sudo install "$RUNNER_TEMP/gopass" /usr/local/bin/gopass

      - uses: ./.github/actions/temporal-cli

      # The suite covers the current gopass release; the older one needs a
      # single extra run of the interop file, not one per shard.
      - name: Verify gopass 1.16.1 compatibility
        if: matrix.shard == 1
        run: |
          mkdir -p "$RUNNER_TEMP/gopass-1.16.1"
          archive="$RUNNER_TEMP/gopass-1.16.1.tar.gz"
          curl -fsSL 'https://github.com/gopasspw/gopass/releases/download/v1.16.1/gopass-1.16.1-linux-amd64.tar.gz' -o "$archive"
          echo "be77309ba4491cedfb847155380fc04c3f356231d368721ee3c69b77ab0c0eb7  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/gopass-1.16.1" gopass
          GOPASS_BIN="$RUNNER_TEMP/gopass-1.16.1/gopass" npx vitest run tests/git-pass-interop.test.ts

      # Includes the standalone UI and browser regressions: tests/web-regressions.test.ts
      # runs every web/*.test.cjs.
      - run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Merging a new cli/package.json version publishes @tavya/cli (cli-release.yml),
  # so a pull request that changes what the CLI ships must bump it.
  cli-version:
    name: CLI version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with: { node-version: '22.16.0' }
      - if: github.event_name == 'pull_request'
        run: npm ci --prefix cli --ignore-scripts --no-audit --no-fund
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-cli-version.mjs "$BASE"

  # Branch protection requires this check. It stands for the jobs above, so it
  # runs even after one of them failed or was cancelled, in order to fail too.
  required:
    name: typecheck + tests
    if: always()
    needs: [checks, test, deploy-artifacts, cli-version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check and test shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS:-none}"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  deploy-artifacts:
    name: deploy artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its base, for the scope below.
          fetch-depth: 2

      # A pull request that changes only paths no image, compose file or
      # Caddyfile reads (tests, docs, other workflows) skips the builds. Any
      # other path builds, and so does every push, merge group and dispatch.
      - name: Decide whether the change can affect the deployment artifacts
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          affects() {
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                tests/*|docs/*|design/*|benchmarks/*|scripts/*|web/*.test.cjs) ;;
                .github/workflows/ci.yml) return 0 ;;
                .github/*) ;;
                */*) return 0 ;;
                *.md) ;;
                *) return 0 ;;
              esac
            done
            return 1
          }
          artifacts=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$changed" | affects || artifacts=false
          fi
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"
          echo "deployment artifacts affected: $artifacts"

      # Exactly what an operator runs: Compose builds the app and edge images
      # in parallel, then starts PostgreSQL, Temporal, the app's database role
      # job, the hosted app and Caddy, and waits for readiness. Caddy signs
      # *.localhost names with its own CA, so no public ACME CA is asked.
      - name: Install the turnkey stack and boot the hosted control plane
        if: steps.scope.outputs.artifacts == 'true'
        run: ./deploy/karmax up karmax.localhost preview.karmax.localhost

      # The Caddyfile's on-demand policy covers every name, so Caddy issues a
      # certificate only at a real handshake, from a public CA, which a
      # *.localhost name cannot get. Check what it can: the edge serves the
      # configured site (redirecting to HTTPS), and reaches its upstream.
      - name: Route the edge to the control plane
        if: steps.scope.outputs.artifacts == 'true'
        env:
          COMPOSE_FILE: deploy/compose.turnkey.yml
          COMPOSE_ENV_FILES: deploy/.turnkey.env
        run: |
          redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            --resolve karmax.localhost:80:127.0.0.1 http://karmax.localhost/api/health/ready)
          echo "edge: $redirect"
          [ "$redirect" = '308 https://karmax.localhost/api/health/ready' ]
          docker compose exec -T caddy wget -qO- http://127.0.0.1:4505/api/health/ready

      - name: Keep the app off the PostgreSQL superuser
        if: steps.scope.outputs.artifacts == 'true'
        env:
          COMPOSE_FILE: deploy/compose.turnkey.yml
          COMPOSE_ENV_FILES: deploy/.turnkey.env
        run: |
          query() { docker compose exec -T postgresql psql -U temporal -d "$1" -Atc "$2"; }
          sessions=$(query postgres "SELECT DISTINCT a.usename || ' superuser=' || r.rolsuper FROM pg_stat_activity a
            JOIN pg_roles r ON r.rolname = a.usename WHERE a.datname = 'karmax'")
          echo "karmax database sessions: $sessions"
          [ "$sessions" = 'karmax superuser=false' ]
          # The operator's own check reports the same.
          ./deploy/karmax doctor | tee "$RUNNER_TEMP/doctor.log"
          grep -F 'The app connects to PostgreSQL as karmax, not a superuser.' "$RUNNER_TEMP/doctor.log"
          [ "$(query karmax "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner <> 'karmax'")" = 0 ]
          url=$(docker compose exec -T app cat /run/karmax-database/database_url)
          docker compose exec -T postgresql psql "${url%@*}@127.0.0.1:5432/karmax" -Atc 'SELECT 1'
          if docker compose exec -T postgresql psql "${url%@*}@127.0.0.1:5432/temporal" -Atc 'SELECT 1' 2>/dev/null; then
            echo "the app's role can connect to Temporal's database" >&2
            exit 1
          fi
          password=$(sed -n 's/^POSTGRES_PASSWORD=//p' deploy/.turnkey.env)
          [ -n "$password" ]
          if docker compose exec -T app sh -c 'env; cat /run/secrets/* /run/karmax-database/*' | grep -qF "$password"; then
            echo 'the PostgreSQL superuser password reached the app container' >&2
            exit 1
          fi

      - name: Load native runtime modules in the image
        if: steps.scope.outputs.artifacts == 'true'
        run: docker run --rm karmax-app node -e "require('node:sqlite'); require('node-pty')"

      - name: Keep the console test suites out of the image
        if: steps.scope.outputs.artifacts == 'true'
        run: docker run --rm karmax-app sh -c 'test -z "$(find /app/web -name "*.test.cjs")"'

      # rate_limit is a third-party module; Caddy refuses to start on a directive
      # it does not recognise, so building the edge is what makes the Caddyfile
      # below valid at all.
      - name: Validate the Caddyfile against the edge image
        if: steps.scope.outputs.artifacts == 'true'
        run: |
          docker run --rm \
            -e KARMAX_DOMAIN=karmax.example.com \
            -e KARMAX_PREVIEW_DOMAIN=preview.karmax.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            karmax-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate both compose profiles
        if: steps.scope.outputs.artifacts == 'true'
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.hosted.yml config -q
          printf 'KARMAX_DOMAIN=karmax.example.com\nKARMAX_PREVIEW_DOMAIN=preview.karmax.example.com\nPOSTGRES_PASSWORD=ci\n' > "$RUNNER_TEMP/ci.env"
          docker compose --project-directory deploy --env-file "$RUNNER_TEMP/ci.env" -f deploy/compose.turnkey.yml config -q

      - name: Show the turnkey stack after a failure
        if: failure() && steps.scope.outputs.artifacts == 'true'
        env:
          COMPOSE_FILE: deploy/compose.turnkey.yml
          COMPOSE_ENV_FILES: deploy/.turnkey.env
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
