name: CI

on:
  push:
    branches: [master]
  pull_request:
  # When an eligible organization-owned deployment enables GitHub's native
  # queue, required checks must report on the speculative landing candidate.
  # Personal/private deployments simply never emit this event.
  merge_group:

# A newer push to the same branch makes the in-flight run redundant. master is
# excluded so every landed commit keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karmax_test
          POSTGRES_PASSWORD: karmax_test
          POSTGRES_DB: karmax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karmax_test -d karmax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # The suite is sequential by design (vitest.config.ts forces singleFork):
    # several concurrent Temporal servers would exhaust the runner. ~10 min of
    # real work, with headroom for a slow runner.
    timeout-minutes: 45
    env:
      # Live suites spend real money and need real provider keys. Docker-gated
      # suites are covered by the deploy-artifacts job instead.
      KARMAX_SKIP_LIVE: '1'
      KARMAX_SKIP_DOCKER: '1'
      TEMPORAL_CLI_VERSION: '1.7.2'
      KARMAX_TEST_POSTGRES_URL: postgres://karmax_test:karmax_test@127.0.0.1:5432/karmax_test
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@v7

      # This lives in the existing required check, so branch protection needs no
      # new check name. Pin both the release and archive digest.
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Validate every repository workflow
        run: |
          "$RUNNER_TEMP/actionlint"

      # Guard the exact outage class: YAML parsers accept this shape, but GitHub
      # rejects the unsupported key before it creates any workflow run.
      - name: Prove unsupported workflow keys fail the gate
        run: |
          invalid="$RUNNER_TEMP/invalid-workflow.yml"
          cp .github/workflows/deploy.yml "$invalid"
          sed -i '/cancel-in-progress: false/a\      queue: max' "$invalid"
          if "$RUNNER_TEMP/actionlint" "$invalid" >"$RUNNER_TEMP/actionlint-negative.log" 2>&1; then
            echo 'actionlint accepted the unsupported concurrency.queue regression fixture' >&2
            exit 1
          fi
          grep -F 'unexpected key "queue"' "$RUNNER_TEMP/actionlint-negative.log"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Integration tests boot a real Temporal dev server. src/temporal/dev-server.ts
      # looks here by default; pinned so a CLI release cannot break the build.
      - name: Install Temporal CLI
        run: |
          mkdir -p ~/.temporalio/bin
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C ~/.temporalio/bin temporal
          ~/.temporalio/bin/temporal --version

      - run: npm run typecheck
      - run: npm test

  deploy-artifacts:
    name: deploy artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the control-plane image
        run: docker build -f deploy/Dockerfile -t karmax:ci .

      # rate_limit is a third-party module; Caddy refuses to start on a directive
      # it does not recognise, so building the edge is what makes the Caddyfile
      # below valid at all.
      - name: Build the edge image
        run: docker build -f deploy/Caddy.Dockerfile -t karmax-caddy:ci deploy

      - name: Validate the Caddyfile against the edge image
        run: |
          docker run --rm \
            -e KARMAX_DOMAIN=karmax.example.com \
            -e KARMAX_PREVIEW_DOMAIN=preview.karmax.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            karmax-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate both compose profiles
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.hosted.yml config -q
          printf 'KARMAX_DOMAIN=karmax.example.com\nKARMAX_PREVIEW_DOMAIN=preview.karmax.example.com\nPOSTGRES_PASSWORD=ci\n' > "$RUNNER_TEMP/ci.env"
          docker compose --project-directory deploy --env-file "$RUNNER_TEMP/ci.env" -f deploy/compose.turnkey.yml config -q

      - name: Check the operator script parses
        run: sh -n deploy/karmax
