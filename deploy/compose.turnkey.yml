name: karmax

x-bounded-logs: &bounded-logs
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  postgresql:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    mem_limit: 768m
    logging: *bounded-logs
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by deploy/karmax}
      POSTGRES_DB: postgres
    volumes:
      - temporal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    restart: "no"
    mem_limit: 512m
    logging: *bounded-logs
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?generated by deploy/karmax}
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?generated by deploy/karmax}
    volumes:
      - ./temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]

  # The app's own login, owning the karmax database and nothing else. Runs as
  # the superuser on every start and exits; see postgres/karmax-role.sql. It
  # generates the app's URL into the karmax_database volume the first time.
  karmax-database:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: "no"
    mem_limit: 256m
    logging: *bounded-logs
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      PGHOST: postgresql
      PGUSER: temporal
      PGPASSWORD: ${POSTGRES_PASSWORD:?generated by deploy/karmax}
    volumes:
      - karmax_database:/run/karmax-database
      - ./postgres/karmax-role.sh:/scripts/karmax-role.sh:ro
      - ./postgres/karmax-role.sql:/scripts/karmax-role.sql:ro
    entrypoint: ["/bin/sh", "/scripts/karmax-role.sh"]

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.0}
    restart: unless-stopped
    mem_limit: 2g
    logging: *bounded-logs
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?generated by deploy/karmax}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/karmax.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/karmax.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    restart: "no"
    mem_limit: 512m
    logging: *bounded-logs
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: karmax
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    logging: *bounded-logs
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      karmax-database:
        condition: service_completed_successfully
    environment:
      KARMAX_DEPLOYMENT: hosted
      KARMAX_SINGLE_NODE: 1
      KARMAX_CELL_ID: ${KARMAX_CELL_ID:-cell-1}
      KARMAX_PUBLIC_URL: https://${KARMAX_DOMAIN:?generated by deploy/karmax}
      KARMAX_PREVIEW_ORIGIN: https://${KARMAX_PREVIEW_DOMAIN:?generated by deploy/karmax}
      KARMAX_TRUSTED_PROXY_IP: gateway
      KARMAX_HOST: 0.0.0.0
      KARMAX_PORT: 4505
      KARMAX_HOME: /var/lib/karmax
      # PostgreSQL-backed production cells isolate workflow work from HTTP.
      KARMAX_WORKER_MODE: ${KARMAX_WORKER_MODE:-process}
      # Empty uses the release's public prebuilt image; org/project choices win.
      KARMAX_E2B_TEMPLATE: ${KARMAX_E2B_TEMPLATE:-}
      KARMAX_AUTH_SECRET_FILE: /run/secrets/auth_secret
      KARMAX_VAULT_KEY_FILE: /run/secrets/vault_key
      KARMAX_WORLD_REF_KEY_FILE: /run/secrets/world_ref_key
      KARMAX_DATABASE_URL_FILE: /run/karmax-database/database_url
      KARMAX_TEMPORAL_ADDRESS: temporal:7233
      KARMAX_TEMPORAL_NAMESPACE: karmax
      # local (the karmax_data volume) unless .turnkey.env sets s3; the keys
      # are in .secrets/s3_access_key_id and s3_secret_access_key. Wiki
      # ops/object-store. An empty delay means 30 days for s3, none for local.
      KARMAX_OBJECT_STORE: ${KARMAX_OBJECT_STORE:-local}
      KARMAX_OBJECT_DELETE_DELAY_DAYS: ${KARMAX_OBJECT_DELETE_DELAY_DAYS:-}
      KARMAX_S3_ENDPOINT: ${KARMAX_S3_ENDPOINT:-}
      KARMAX_S3_BUCKET: ${KARMAX_S3_BUCKET:-}
      KARMAX_S3_REGION: ${KARMAX_S3_REGION:-}
      KARMAX_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      KARMAX_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      # The Cloudflare Worker sandboxes save resources through;
      # written by `deploy/karmax deploy-repository-edge`, empty means none.
      KARMAX_RESOURCE_EDGE_URL: ${KARMAX_RESOURCE_EDGE_URL:-}
      KARMAX_CLOUD_WORLD_PROVIDER: ${KARMAX_CLOUD_WORLD_PROVIDER:-e2b}
      # Optional sign-in providers, empty unless set in .turnkey.env. This block
      # is a whitelist, so a variable missing from it never reaches the app —
      # the operator configures an OAuth client, restarts, and nothing happens.
      # Empty defaults keep every provider optional: absent means its button is absent.
      KARMAX_GOOGLE_CLIENT_ID: ${KARMAX_GOOGLE_CLIENT_ID:-}
      KARMAX_GOOGLE_CLIENT_SECRET: ${KARMAX_GOOGLE_CLIENT_SECRET:-}
      KARMAX_GITHUB_OAUTH_CLIENT_ID: ${KARMAX_GITHUB_OAUTH_CLIENT_ID:-}
      KARMAX_GITHUB_OAUTH_CLIENT_SECRET: ${KARMAX_GITHUB_OAUTH_CLIENT_SECRET:-}
      KARMAX_OIDC_ISSUER: ${KARMAX_OIDC_ISSUER:-}
      KARMAX_OIDC_DISCOVERY_URL: ${KARMAX_OIDC_DISCOVERY_URL:-}
      KARMAX_OIDC_CLIENT_ID: ${KARMAX_OIDC_CLIENT_ID:-}
      KARMAX_OIDC_CLIENT_SECRET: ${KARMAX_OIDC_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CLIENT_ID: ${STRIPE_CLIENT_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    secrets:
      - auth_secret
      - vault_key
      - world_ref_key
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - karmax_data:/var/lib/karmax
      - karmax_database:/run/karmax-database:ro
    ports: ["127.0.0.1:4505:4505"]
    stop_grace_period: 60s

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging: *bounded-logs
    depends_on:
      app:
        condition: service_healthy
    environment:
      KARMAX_DOMAIN: ${KARMAX_DOMAIN:?generated by deploy/karmax}
      KARMAX_PREVIEW_DOMAIN: ${KARMAX_PREVIEW_DOMAIN:?generated by deploy/karmax}
      KARMAX_LEGACY_DOMAIN: ${KARMAX_LEGACY_DOMAIN:-http://127.0.0.1:65535}
      KARMAX_LEGACY_WWW_DOMAIN: ${KARMAX_LEGACY_WWW_DOMAIN:-http://127.0.0.1:65534}
    # Host ingress preserves IPv6 peers instead of Docker userland-proxy NAT.
    network_mode: host
    # Its admin API is off, so a changed Caddyfile applies when Caddy is
    # recreated, which a changed digest makes `up` do (deploy/karmax sets it).
    labels:
      karmax.caddyfile-sha256: ${KARMAX_CADDYFILE_SHA256:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  auth_secret: { file: ./.secrets/auth_secret }
  vault_key: { file: ./.secrets/vault_key }
  world_ref_key: { file: ./.secrets/world_ref_key }
  s3_access_key_id: { file: ./.secrets/s3_access_key_id }
  s3_secret_access_key: { file: ./.secrets/s3_secret_access_key }

volumes:
  karmax_data:
  karmax_database:
  temporal_postgres:
  caddy_data:
  caddy_config:
