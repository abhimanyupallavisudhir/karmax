name: karmax

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      KARMAX_DEPLOYMENT: hosted
      KARMAX_CELL_ID: ${KARMAX_CELL_ID:-cell-1}
      KARMAX_PUBLIC_URL: https://${KARMAX_DOMAIN:?set KARMAX_DOMAIN}
      KARMAX_PREVIEW_ORIGIN: https://${KARMAX_PREVIEW_DOMAIN:?set KARMAX_PREVIEW_DOMAIN}
      KARMAX_HOST: 0.0.0.0
      KARMAX_PORT: 4505
      KARMAX_HOME: /var/lib/karmax
      # PostgreSQL-backed production cells isolate workflow work from HTTP.
      KARMAX_WORKER_MODE: ${KARMAX_WORKER_MODE:-process}
      # Empty uses the release's public prebuilt image; org/project choices win.
      KARMAX_E2B_TEMPLATE: ${KARMAX_E2B_TEMPLATE:-}
      KARMAX_AUTH_SECRET_FILE: /run/secrets/auth_secret
      KARMAX_VAULT_KEY_FILE: /run/secrets/vault_key
      KARMAX_WORLD_REF_KEY_FILE: /run/secrets/world_ref_key
      KARMAX_DATABASE_URL_FILE: /run/secrets/database_url
      KARMAX_TEMPORAL_ADDRESS: ${KARMAX_TEMPORAL_ADDRESS:?set external Temporal address}
      KARMAX_TEMPORAL_NAMESPACE: ${KARMAX_TEMPORAL_NAMESPACE:-karmax}
      KARMAX_TEMPORAL_API_KEY_FILE: /run/secrets/temporal_api_key
      KARMAX_OBJECT_STORE: s3
      KARMAX_S3_ENDPOINT: ${KARMAX_S3_ENDPOINT:?set S3 endpoint}
      KARMAX_S3_BUCKET: ${KARMAX_S3_BUCKET:?set S3 bucket}
      KARMAX_S3_REGION: ${KARMAX_S3_REGION:-us-east-1}
      # Included physical snapshot storage per organization. 0 disables the
      # ceiling; public SaaS operators should keep a finite value.
      KARMAX_MANAGED_STORAGE_QUOTA_BYTES: ${KARMAX_MANAGED_STORAGE_QUOTA_BYTES:-5368709120}
      # Optional installation authorization boundary for platform-funded model
      # rails. Empty keeps managed model admission disabled regardless of org UI.
      KARMAX_MANAGED_MODEL_REQUEST_CEILINGS: ${KARMAX_MANAGED_MODEL_REQUEST_CEILINGS:-}
      KARMAX_MANAGED_MODEL_PRICING: ${KARMAX_MANAGED_MODEL_PRICING:-}
      KARMAX_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      KARMAX_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      KARMAX_CLOUD_WORLD_PROVIDER: ${KARMAX_CLOUD_WORLD_PROVIDER:-e2b}
      # Optional sign-in providers — see the note in compose.turnkey.yml: this
      # block is a whitelist, so anything absent here silently never arrives.
      KARMAX_GOOGLE_CLIENT_ID: ${KARMAX_GOOGLE_CLIENT_ID:-}
      KARMAX_GOOGLE_CLIENT_SECRET: ${KARMAX_GOOGLE_CLIENT_SECRET:-}
      KARMAX_GITHUB_OAUTH_CLIENT_ID: ${KARMAX_GITHUB_OAUTH_CLIENT_ID:-}
      KARMAX_GITHUB_OAUTH_CLIENT_SECRET: ${KARMAX_GITHUB_OAUTH_CLIENT_SECRET:-}
      KARMAX_OIDC_ISSUER: ${KARMAX_OIDC_ISSUER:-}
      KARMAX_OIDC_DISCOVERY_URL: ${KARMAX_OIDC_DISCOVERY_URL:-}
      KARMAX_OIDC_CLIENT_ID: ${KARMAX_OIDC_CLIENT_ID:-}
      KARMAX_OIDC_CLIENT_SECRET: ${KARMAX_OIDC_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    secrets:
      - auth_secret
      - vault_key
      - world_ref_key
      - database_url
      - temporal_api_key
      - s3_access_key
      - s3_secret_key
    volumes:
      - karmax_data:/var/lib/karmax
    expose: ["4505"]
    stop_grace_period: 60s

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      KARMAX_DOMAIN: ${KARMAX_DOMAIN:?set KARMAX_DOMAIN}
      KARMAX_PREVIEW_DOMAIN: ${KARMAX_PREVIEW_DOMAIN:?set KARMAX_PREVIEW_DOMAIN}
      KARMAX_LEGACY_DOMAIN: ${KARMAX_LEGACY_DOMAIN:-http://127.0.0.1:65535}
      KARMAX_LEGACY_WWW_DOMAIN: ${KARMAX_LEGACY_WWW_DOMAIN:-http://127.0.0.1:65534}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  auth_secret: { file: ./.secrets/auth_secret }
  vault_key: { file: ./.secrets/vault_key }
  world_ref_key: { file: ./.secrets/world_ref_key }
  database_url: { file: ./.secrets/database_url }
  temporal_api_key: { file: ./.secrets/temporal_api_key }
  s3_access_key: { file: ./.secrets/s3_access_key }
  s3_secret_key: { file: ./.secrets/s3_secret_key }

volumes:
  karmax_data:
  caddy_data:
  caddy_config:
